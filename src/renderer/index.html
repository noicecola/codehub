<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeHub</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="panels.css">
  <link rel="stylesheet" href="input.css">
  <link rel="stylesheet" href="modals.css">
  <link rel="stylesheet" href="highlight-theme.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <button id="sidebar-toggle-btn" class="sidebar-toggle" title="折叠">◀</button>
        <h2>CodeHub</h2>
        <button id="new-session-btn" title="新建会话">+</button>
      </div>
      <div class="sidebar-search">
        <input id="session-search" type="text" placeholder="搜索会话..." />
      </div>
      <div class="session-filters">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="running">进行中</button>
        <button class="filter-btn" data-filter="completed">已完成</button>
      </div>
      <div id="session-list"></div>
      <div class="sidebar-footer">
        <button id="manage-tools-btn" class="sidebar-tool-btn"><span class="btn-icon">⚙️</span> 工具</button>
        <button id="manage-presets-btn" class="sidebar-tool-btn"><span class="btn-icon">📋</span> 预设</button>
        <button id="manage-templates-btn" class="sidebar-tool-btn"><span class="btn-icon">📝</span> 模板</button>
      </div>
    </aside>

    <div id="main">
      <header id="toolbar">
        <div id="toolbar-actions">
          <div id="template-dropdown" class="dropdown hidden">
            <div id="template-list"></div>
          </div>
          <button id="template-btn" class="tool-btn" title="消息模板"><span class="btn-icon">📝</span></button>
          <button id="artifacts-btn" class="tool-btn" title="产物" style="display:none"><span class="btn-icon">📦</span></button>
          <button id="compare-btn" class="tool-btn" title="对比">对比</button>
          <button id="edit-tags-btn" class="tool-btn" title="标签"><span class="btn-icon">🏷️</span></button>
          <button id="export-btn" class="tool-btn" title="导出"><span class="btn-icon">💾</span></button>
          <select id="work-dir-select"><option value="">目录</option></select>
          <button id="browse-dir-btn" class="tool-btn" title="选择目录"><span class="btn-icon">📁</span></button>
        </div>
      </header>

      <main id="output-panel">
        <div id="welcome-screen">
          <div class="welcome-logo">C</div>
          <h2>CodeHub</h2>
          <p class="subtitle">多工具消息分发桌面端</p>
          <p class="hint">选择工具 → 输入消息 → 同时发送给多个 AI 编码工具，并行执行对比结果</p>
          
          <div class="quick-start-cards">
            <div class="quick-start-card" data-action="new-session">
              <div class="card-icon">✨</div>
              <div class="card-title">新建会话</div>
              <div class="card-desc">开始新的对话</div>
            </div>
            <div class="quick-start-card" data-action="load-template">
              <div class="card-icon">📝</div>
              <div class="card-title">使用模板</div>
              <div class="card-desc">快速填充消息</div>
            </div>
            <div class="quick-start-card" data-action="manage-tools">
              <div class="card-icon">🔧</div>
              <div class="card-title">管理工具</div>
              <div class="card-desc">配置 AI 工具</div>
            </div>
          </div>

          <div class="tool-status-bar" id="tool-status-bar">
            <!-- Dynamic tool status items -->
          </div>

          <div class="tips">
            <span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> 发送</span>
            <span><kbd>/</kbd> 搜索</span>
            <span>左侧管理会话</span>
          </div>
        </div>

        <div id="panels-wrapper" class="panels-wrapper hidden">
          <div id="tool-panels" class="tool-panels"></div>
          <div id="scrollbar-track" class="scrollbar-track">
            <div id="scrollbar-thumb" class="scrollbar-thumb"></div>
          </div>
        </div>
      </main>

      <footer id="input-area">
        <div id="tool-selector"></div>
        <div class="preset-bar" id="preset-bar">
          <!-- Dynamic preset buttons -->
        </div>
        <div class="input-wrapper">
          <textarea id="message-input" placeholder="输入消息... (Ctrl+Enter 发送)" rows="2"></textarea>
          <span class="char-count" id="char-count">0</span>
        </div>
        <div id="input-controls">
          <div id="selected-tools-info">
            <span class="tools-count-badge" id="tools-count-badge">0 个工具</span>
          </div>
          <div id="input-buttons">
            <button id="send-btn" disabled>发送</button>
            <button id="stop-btn" style="display:none">停止</button>
          </div>
        </div>
      </footer>
    </div>

    <!-- 弹窗 -->
    <div id="compare-modal" class="modal hidden">
      <div class="modal-content"><div class="modal-header"><h3>结果对比</h3><button class="close-btn" data-close="compare-modal">&times;</button></div><div id="compare-content"></div></div>
    </div>
    <div id="artifacts-modal" class="modal hidden">
      <div class="modal-content modal-wide"><div class="modal-header"><h3>产物浏览</h3><button class="close-btn" data-close="artifacts-modal">&times;</button></div><div id="artifacts-content"><div class="artifacts-layout"><div id="artifacts-file-list"></div><div id="artifacts-file-content"><p class="placeholder">选择文件查看内容</p></div></div></div></div>
    </div>
    <div id="export-modal" class="modal hidden">
      <div class="modal-content modal-narrow"><div class="modal-header"><h3>导出会话</h3><button class="close-btn" data-close="export-modal">&times;</button></div><div class="modal-body"><p>选择格式：</p><div class="export-options"><button class="export-option" data-format="markdown">📄 Markdown</button><button class="export-option" data-format="json">📋 JSON</button></div></div></div>
    </div>
    <div id="tools-modal" class="modal hidden">
      <div class="modal-content modal-narrow"><div class="modal-header"><h3>工具管理</h3><button class="close-btn" data-close="tools-modal">&times;</button></div><div class="modal-body"><div id="tools-list"></div><div class="add-tool-form"><h4>添加自定义工具</h4><input id="tool-name-input" placeholder="名称" /><input id="tool-command-input" placeholder="命令 (如 python3)" /><input id="tool-args-input" placeholder="参数 (可选)" /><button id="add-tool-btn" class="primary-btn">添加</button></div></div></div>
    </div>
    <div id="templates-modal" class="modal hidden">
      <div class="modal-content modal-narrow"><div class="modal-header"><h3>模板管理</h3><button class="close-btn" data-close="templates-modal">&times;</button></div><div class="modal-body"><div id="templates-list"></div><div class="add-template-form"><h4>添加模板</h4><input id="tpl-name-input" placeholder="名称" /><textarea id="tpl-content-input" placeholder="内容" rows="2"></textarea><button id="add-tpl-btn" class="primary-btn">添加</button></div></div></div>
    </div>
    <div id="presets-modal" class="modal hidden">
      <div class="modal-content modal-narrow"><div class="modal-header"><h3>工具预设</h3><button class="close-btn" data-close="presets-modal">&times;</button></div><div class="modal-body"><div id="presets-list"></div><button id="save-preset-btn" class="primary-btn">保存当前选择为预设</button></div></div>
    </div>
  </div>
  <script src="marked.min.js"></script>
  <script src="highlight.min.js"></script>
  <script src="hljs-javascript.js"></script>
  <script src="hljs-python.js"></script>
  <script src="hljs-bash.js"></script>
  <script src="hljs-json.js"></script>
  <script src="hljs-css.js"></script>
  <script src="hljs-html.js"></script>
  <script src="hljs-typescript.js"></script>
  <script src="hljs-go.js"></script>
  <script src="hljs-rust.js"></script>
  <script src="hljs-java.js"></script>
  <script src="hljs-c.js"></script>
  <script src="hljs-cpp.js"></script>
  <script src="hljs-sql.js"></script>
  <script src="hljs-yaml.js"></script>
  <script src="hljs-markdown.js"></script>
  <script src="../components/toast.js"></script>
  <script src="../components/modal.js"></script>
  <script src="../components/diff-viewer.js"></script>
  <script src="state.js"></script>
  <script src="tools.js"></script>
  <script src="output.js"></script>
  <script src="messages.js"></script>
  <script src="modals.js"></script>
  <script src="sessions.js"></script>
  <script src="app.js"></script>
  <script src="enhancements.js"></script>
</body>
</html>
