<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', monospace; color: #eee; flex-direction: column; gap: 16px; }
#score { font-size: 20px; letter-spacing: 2px; }
canvas { border: 2px solid #16213e; border-radius: 4px; box-shadow: 0 0 20px rgba(0,180,255,0.15); }
#overlay { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 12px; pointer-events: none; }
#overlay span { font-size: 28px; font-weight: bold; }
#overlay small { font-size: 14px; opacity: 0.7; }
</style>
</head>
<body>
<div id="score">得分: 0</div>
<canvas id="canvas" width="400" height="400"></canvas>
<div id="overlay"><span id="msg"></span><small id="sub"></small></div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const msgEl = document.getElementById('msg');
const subEl = document.getElementById('sub');

const CELL = 20;
const COLS = canvas.width / CELL;
const ROWS = canvas.height / CELL;
const TICK_MS = 120;

let snake, dir, nextDir, food, score, running, timer;

function init() {
  snake = [{x: Math.floor(COLS/2), y: Math.floor(ROWS/2)}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  scoreEl.textContent = '得分: 0';
  msgEl.textContent = '';
  subEl.textContent = '';
  placeFood();
  running = true;
  clearInterval(timer);
  timer = setInterval(tick, TICK_MS);
}

function placeFood() {
  let pos;
  do {
    pos = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

function tick() {
  if (!running) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    running = false;
    clearInterval(timer);
    msgEl.textContent = '游戏结束';
    subEl.textContent = '按任意键重新开始';
    return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = '得分: ' + score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#0f3460';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#e94560';
  ctx.beginPath();
  ctx.arc(food.x*CELL + CELL/2, food.y*CELL + CELL/2, CELL/2 - 2, 0, Math.PI*2);
  ctx.fill();

  snake.forEach((s, i) => {
    const brightness = 1 - i * 0.02;
    ctx.fillStyle = i === 0 ? '#00b4d8' : `rgba(0,180,216,${Math.max(0.3, brightness)})`;
    ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2);
    if (i === 0) {
      ctx.fillStyle = '#fff';
      const ex = dir.x === 0 ? 2 : (dir.x > 0 ? 4 : 0);
      const ey = dir.y === 0 ? 2 : (dir.y > 0 ? 4 : 0);
      ctx.fillRect(s.x*CELL+6+ex, s.y*CELL+6+ey, 3, 3);
      ctx.fillRect(s.x*CELL+11+ex, s.y*CELL+6+ey, 3, 3);
    }
  });
}

document.addEventListener('keydown', e => {
  if (!running) { init(); return; }
  switch(e.key) {
    case 'ArrowUp':    case 'w': if (dir.y !== 1)  nextDir = {x:0,y:-1}; break;
    case 'ArrowDown':  case 's': if (dir.y !== -1) nextDir = {x:0,y:1};  break;
    case 'ArrowLeft':  case 'a': if (dir.x !== 1)  nextDir = {x:-1,y:0}; break;
    case 'ArrowRight': case 'd': if (dir.x !== -1) nextDir = {x:1,y:0};  break;
  }
  e.preventDefault();
});

init();
draw();
</script>
</body>
</html>
